<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda de Móviles</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1b1f24;--muted:#5d6672;--line:#dde1e6;--accent:#1f4f8f;--accent-ink:#fff;
--ok:#1d7a46;--ok-bg:#e3f4ea;--warn:#8a5a00;--warn-bg:#fdf1d8;--bad:#a8261b;--bad-bg:#fbe5e2;--info:#1f4f8f;--info-bg:#e4ecf7;--pur:#5b3aa0;--pur-bg:#ece6f7;--res:#1f6670;--res-bg:#dcf0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--panel:#1a1f25;--ink:#e6e9ed;--muted:#9aa4b0;--line:#2c333b;--accent:#6ea0e6;--accent-ink:#0d1117;
--ok:#6fd39b;--ok-bg:#163324;--warn:#f0c060;--warn-bg:#3a2d10;--bad:#f08a80;--bad-bg:#3d1b18;--info:#8fb6ee;--info-bg:#18273b;--pur:#b9a2ee;--pur-bg:#2a2140;--res:#7fd0d8;--res-bg:#123236}}
:root[data-theme="dark"]{--bg:#111418;--panel:#1a1f25;--ink:#e6e9ed;--muted:#9aa4b0;--line:#2c333b;--accent:#6ea0e6;--accent-ink:#0d1117;
--ok:#6fd39b;--ok-bg:#163324;--warn:#f0c060;--warn-bg:#3a2d10;--bad:#f08a80;--bad-bg:#3d1b18;--info:#8fb6ee;--info-bg:#18273b;--pur:#b9a2ee;--pur-bg:#2a2140;--res:#7fd0d8;--res-bg:#123236}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{font-size:16px;margin:0}
header .sub{color:var(--muted);font-size:12px}
.hctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--info-bg);color:var(--info);font-weight:600}
main{padding:16px;max-width:1280px;margin:0 auto}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.big{font-size:32px;font-weight:700;line-height:1.1}
.big span{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.muted{color:var(--muted)}
.small{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.pur{background:var(--pur-bg);color:var(--pur)}.gray{background:var(--bg);color:var(--muted)}
.alert{margin-top:10px;padding:6px 10px;border-radius:8px;font-size:13px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--bg)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--info-bg)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,input,button{font:inherit;color:var(--ink)}
select,input[type=text],input[type=date],input[type=datetime-local],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;max-width:100%}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dan{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.serv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.serv.arr{border-left:4px solid var(--warn)}
.serv.closed{opacity:.7}
.serv .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.dot{width:100%;border-collapse:collapse;margin-top:8px;min-width:0}
.dot td{padding:5px 6px;font-size:13px}
.dot tr.off td{color:var(--muted);text-decoration:line-through}
.box{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.db{padding:14px 16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 14px;margin-bottom:12px}
.kv div span{display:block;font-size:11px;color:var(--muted)}
.ag{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
.ag.solo{grid-template-columns:minmax(0,1fr)}
.carga h3{margin-bottom:10px}
.fld{margin-bottom:8px;min-width:0}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.fld input,.ancho{width:100%}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.dos{grid-template-columns:1fr}}
.hint{font-size:12px;min-height:0;margin-top:2px}
.radpar{display:grid;grid-template-columns:1fr 96px;gap:8px}
.radpar select,.radpar input{width:100%}
.combo{position:relative;flex:1;min-width:170px}
.combo input{width:100%}
.combo-lst{position:absolute;z-index:30;left:0;right:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.combo-g{padding:7px 10px 2px;font-size:11px;font-weight:600;color:var(--muted)}
.combo-op{padding:7px 10px;cursor:pointer}
.combo-op:hover,.combo-op.act{background:var(--accent);color:var(--accent-ink)}
.combo-op.nuevo{border-top:1px solid var(--line);color:var(--warn);font-weight:600}
.lg{width:26px;height:26px;object-fit:contain;flex:none}
.movcel{display:flex;align-items:center;gap:8px}
.chipt{display:inline-flex;align-items:center;gap:6px;padding:5px 12px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}
.res{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:10px;border:1px solid;border-left-width:6px;font-size:14px;line-height:1.5}
.res.ok{background:var(--ok-bg);border-color:var(--ok)}.res.bad{background:var(--bad-bg);border-color:var(--bad)}.res.warn{background:var(--warn-bg);border-color:var(--warn)}
.res-ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--panel)}
.res.ok .res-ic{background:var(--ok)}.res.bad .res-ic{background:var(--bad)}.res.warn .res-ic{background:var(--warn)}
.res-c{flex:1;min-width:0}
.res-t{font-weight:700;font-size:15px;margin-bottom:2px}.res.ok .res-t{color:var(--ok)}.res.bad .res-t{color:var(--bad)}.res.warn .res-t{color:var(--warn)}
.res-q{font-weight:600;color:var(--text,inherit);background:var(--panel);border-radius:6px;padding:1px 7px;margin-left:6px;font-size:13px}
.res-p{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}.res-p .small{margin-right:auto}
.b.rsv{background:var(--res-bg);color:var(--res)}
.okt{color:var(--ok)}.badt{color:var(--bad)}.warnt{color:var(--warn,#d9a441)}
.libres{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.libres .small{width:100%}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.rad{letter-spacing:.02em}
tr.cerrado td{opacity:.6}
.gb{width:320px}
@media (max-width:900px){.ag{grid-template-columns:minmax(0,1fr)}.gb{width:100%}}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.fchip b{margin-left:4px}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
tr.grp td{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);padding:5px 10px}
.asig{color:var(--accent);font-weight:600}
.paso{border-bottom:1px solid var(--line);padding:10px 0}
.paso:first-child{padding-top:0}
.paso>b{display:block;margin-bottom:4px}
.valor{font-size:20px;font-weight:700}
.grande{padding:11px 14px;font-weight:600;margin-top:12px}
.mas{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.mas+.mas{margin-top:0}
.mas summary{cursor:pointer;color:var(--muted);font-size:13px}
.dhr{display:flex;gap:8px;align-items:center}
.dh{gap:10px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:10;max-width:calc(100vw - 32px)}
@media (max-width:600px){.big{font-size:26px}main{padding:12px 16px}}
</style>
</head>

 if(x)return{ok:false,mot:x.tipo+(x.hasta?' hasta '+fmt(x.hasta).slice(0,5):'')};if(!p.calle)return{ok:false,mot:'No es personal de calle'};return{ok:true,mot:''}}

 const ok=m?!!servA(m.id)||est(m)==='RES'||!m.activo:!sinAgendar(x.dir).length;
 if(ok){x.abierto=false;x.resuelto=iso();x.por='Sistema';x.auto=true;S.audit.push({ts:iso(),u:'Sistema',acc:'Reclamo resuelto',det:`${x.texto} · se resolvió solo: ${m?'el móvil ya está agendado o reservado':'ya no hay móviles sin agendar'} · a los ${dur(x.ts)}`,movil:x.movil||null,dni:null})}}}
function vResueltos(r){const l=S.reclamos.filter(x=>!x.abierto&&(!r.dir||x.dir===r.dir)&&Date.now()-new Date(x.resuelto)<864e5).reverse();if(!l.length)return'';
 return`<details class="mas"><summary>Resueltos en las últimas 24 Hs (${l.length})</summary><div class="tw" style="margin:8px 0 0"><table><tr><th>Resuelto</th><th>A</th><th>Pedido</th><th>Cómo</th><th>Tardó</th></tr>${l.map(x=>`<tr><td>${fmt(x.resuelto)}</td><td>${DIRN[x.dir]}</td><td>${esc(x.texto)}</td><td>${x.auto?'<span class="b ok">Se resolvió solo</span>':`<span class="b info">Marcado por ${esc(x.por)}</span>`}</td><td>${durEntre(x.ts,x.resuelto)}</td></tr>`).join('')}</table></div></details>`}

function turnoBase(){const h=new Date().getHours();return h>=7&&h<14?'T1':'T2'}
function fechaBase(){const d=new Date();if(d.getHours()<7)d.setDate(d.getDate()-1);return ds(d)}

// ---------- agenda: búsquedas y reglas de carga ----------
// cupo por rol en un móvil (supuesto a confirmar): 1 chofer, 1 jefe de coche, hasta 2 acompañantes

const zonaDe=u=>{if(dirOf(u)==='M')return'Monitoreo';const z=UM[u]&&UM[UM[u].padre];return z?z.nombre.replace('Departamento Territorial ',''):''};

const partesRad=rad=>{const m=(rad||'').match(/^([A-Z]+)(\d+)$/);return m?{nom:m[1],num:m[2]}:{nom:'',num:''}};
const ZDIR={Norte:'N',Este:'N',Sur:'S',Centro:'S',Oeste:'S',Monitoreo:'M'};
const ALIAS_INV={};for(const v in DESIG_ALIAS)(ALIAS_INV[DESIG_ALIAS[v]]=ALIAS_INV[DESIG_ALIAS[v]]||[]).push(v);
const soloLetras=x=>compacto(x).replace(/[0-9]/g,'');
// lista base del SAE más los nombres que sumó el General
const catZona=z=>[...(DESIG[z]||[]),...(z==='Monitoreo'?[['ALERTA','',[]]]:[]),...S.desigExtra.filter(e=>e.zona===z).map(e=>[e.nom,e.unidad||'',[]])];
const zonaNombre=nom=>{for(const z in ZDIR)if(catZona(z).some(e=>e[0]===nom))return z;return null};
const numerosEnUso=(nom,salvo)=>S.servicios.filter(s=>!s.finReal&&s.id!==salvo&&partesRad(s.rad).nom===nom).map(s=>partesRad(s.rad).num).sort();
// nombres de la dirección donde trabaja el móvil: su división, su zona y las otras zonas de esa dirección
function gruposNombre(u){const z=zonaDe(u),dir=dirOf(u),zona=catZona(z),prop=zona.filter(e=>e[1]===u).map(e=>e[0]),resto=zona.filter(e=>e[1]!==u).map(e=>e[0]),g=[];
 if(prop.length)g.push(['Su división',prop]);if(resto.length)g.push([z==='Monitoreo'?z:'Zona '+z,resto]);
 for(const y in ZDIR)if(y!==z&&ZDIR[y]===dir)g.push(['Otra zona: '+y,catZona(y).map(e=>e[0])]);
 return g}

function resolverNombre(txt,u){const c=soloLetras(txt),a=DESIG_ALIAS[c]||c,ok=!!a&&gruposNombre(u).some(g=>g[1].includes(a));return{nom:ok?a:c,ok}}
function avisoRad(nom,num,u,salvo,exc,enLista){if(!nom)return'';const rad=armarRad(nom,num),o=rad&&radEnUso(rad,salvo);
 if(o)return`<span class="badt">${esc(rad)} ya la usa ${movTxt(MM[o.movil])} en ${short(o.unidad)}</span>`;
 const z=zonaDe(u),y=zonaNombre(nom),us=numerosEnUso(nom,salvo),ocup=us.length?`En uso de ${esc(nom)}: ${us.join(', ')}. `:'';
 const fuera=y&&y!==z?`<span class="warnt">${esc(nom)} es de la zona ${esc(y)}, no de ${esc(z)}. </span>`:'';
 const lista=exc?'<span class="warnt">Excepción: queda registrada y el General puede sumarla a la lista. </span>':!enLista?'<span class="warnt">No está en la lista: elegí una opción o usalo como excepción. </span>':'';
 if(rad&&!fuera&&(enLista||exc))return`<span class="okt">${esc(rad)} está libre. </span>${lista}<span class="muted">${ocup}</span>`;
 return fuera+lista+`<span class="muted">${ocup}</span>`}
// campo que se escribe y va mostrando opciones
const comboRad=(id,u,val,attr)=>`<div class="combo"><input type="text" id="${id}" ${attr} data-combo="1" data-u="${u}" value="${esc(val)}" placeholder="Escribí o elegí" autocomplete="off" style="text-transform:uppercase" role="combobox" aria-autocomplete="list" aria-controls="lst-${id}"><div class="combo-lst" id="lst-${id}" role="listbox" hidden></div></div>`;
function pintarCombo(t){const l=$('#lst-'+t.id),u=t.dataset.u,q=t.value.trim(),r=resolverNombre(q,u),todos=gruposNombre(u).flatMap(([g,ns])=>ns.map(n=>({n,g}))),aju=q?filtroTol(todos,x=>[x.n,...(ALIAS_INV[x.n]||[])],q).l:todos;

// deja constancia del nombre usado fuera de la lista

const sitEstado=z=>{const n=Date.now();return new Date(z.desde)>n?'prox':z.hasta&&new Date(z.hasta)<n?'fin':'vig'};
const SITB={vig:['bad','Vigente'],prox:['info','Próxima'],fin:['gray','Terminada']};
function secSit(p,ed){const l=p.sit.map((z,i)=>({z,i})).sort((a,b)=>new Date(b.z.desde)-new Date(a.z.desde));

 if(ed&&!p.baja)h+=`<details class="mas" id="det-sit"><summary>Cargar licencia, TNO o suspensión</summary><div class="fld" style="margin-top:8px"><label for="st-tipo">Tipo</label><select id="st-tipo" class="ancho">${opts(SITS.map(x=>[x,x]))}</select></div>
 <div class="dos">${fldF('st-des','Desde',`<input type="date" id="st-des" value="${hoyISO()}">`)}${fldF('st-has','Hasta',`<input type="date" id="st-has">`)}</div>

 return h}

// ---------- cambios reversibles: cada edición guarda cómo estaba antes ----------
const CAMPOS={pers:{nom:'nombre',jer:'jerarquía',funcion:'función',unidad:'división',calle:'personal de calle'},movil:{matricula:'interno',dominio:'patente',tipo:'vehículo',marca:'marca',modelo:'modelo',programa:'tipo',unidad:'división'}};
const valTxt=(k,v)=>k==='unidad'?`${short(v)} (${DIRN[dirOf(v)]})`:k==='calle'?(v?'sí':'no'):String(v);
const entidad=(tipo,ref)=>tipo==='pers'?PM[ref]:MM[ref];
const nomEnt=(tipo,e)=>tipo==='pers'?`${e.jer} ${e.nom}`:movTxt(e);
// el último cambio vigente: no cuenta los que ya se deshicieron ni los propios "deshacer"; así se retrocede de a un paso
const ultimoCambio=(tipo,ref)=>S.cambios.filter(c=>c.tipo===tipo&&c.ref===ref&&!c.deshecho&&!c.revierte).at(-1);
// aplica los datos nuevos, deja registro y devuelve false si no cambió nada
function aplicarCambio(tipo,ref,antes,despues,acc){const e=entidad(tipo,ref),ks=Object.keys(despues).filter(k=>antes[k]!==despues[k]);if(!ks.length)return false;
 const nombre=nomEnt(tipo,e),det=`${nombre}: ${ks.map(k=>`${CAMPOS[tipo][k]}: ${valTxt(k,antes[k])} → ${valTxt(k,despues[k])}`).join('; ')}`;
 const a=Object.fromEntries(ks.map(k=>[k,antes[k]])),d=Object.fromEntries(ks.map(k=>[k,despues[k]])),id='C'+(S.seq++);
 S.cambios.push({id,tipo,ref,antes:a,despues:d,ts:iso(),por:rol().nombre});Object.assign(e,d);
 log(acc||(ks.length===1&&ks[0]==='unidad'?(tipo==='pers'?'Pase':'Cambio de división'):'Datos modificados'),det,tipo==='movil'?ref:null,tipo==='pers'?ref:null);S.audit.at(-1).cambio=id;return true}
function btnDes(a){if(!a.cambio||!rol().edit)return'';const c=S.cambios.find(z=>z.id===a.cambio);if(!c||ultimoCambio(c.tipo,c.ref)!==c)return'';const e=entidad(c.tipo,c.ref);
 return e&&canEdit(e.unidad)?`<button class="btn" data-act="deshacer" data-c="${c.id}">Deshacer</button>`:''}

   :{tipo:'bad',tit:'No figura en la flota ni en la agenda',det:[`Revisá cómo se escuchó: ${esc(t)}`,'Se creó una alerta para revisarlo.'],q:t,ts:hora}},

 prestar(el){const m=MM[el.dataset.id];if(servA(m.id))return toast('Cerrá primero el servicio en curso');const dest=$('#pd').value,cd=$('#pc').checked;
  S.prestamos.push({id:'P'+(S.prestamos.length+1),movil:m.id,origen:m.unidad,destino:dest,desde:iso(),hasta:null,autorizo:rol().nombre,conDot:cd});

  p.hasta=iso();log('Devolución',`${movTxt(m)} vuelve de ${short(p.destino)} a ${short(p.origen)}`,m.id);toast('Préstamo cerrado: el móvil volvió a su dirección')},
 cargar(){const v=validarCarga();if(v.err)return toast(v.err);const{m,rad,dot}=v;
  const T=S.turnos.find(t=>t.id===ui.aTurno),[i,f]=rango(ui.aFecha,T),desde=new Date(Math.max(Date.now(),i.getTime())).toISOString();
  S.servicios.push({id:'S'+(S.seq++),movil:m.id,unidad:ui.aUnidad,fecha:ui.aFecha,turno:ui.aTurno,inicio:i.toISOString(),finPrev:f.toISOString(),finReal:null,ret:null,rad,radHist:[],dot:dot.map(z=>({...z,desde,hasta:null}))});
  log('Móvil agendado',`${rad} · ${movTxt(m)} en ${short(ui.aUnidad)} · ${T.nombre} ${ui.aFecha} · ${dot.length} integrante(s)`,m.id);if(v.exc)regExc(partesRad(rad).nom,rad,ui.aUnidad,m.id);dot.forEach(z=>regOtraDir(PM[z.dni],rad,ui.aUnidad,m.id));
  ui.drM=null;$('#dlg').close();toast(`${rad} en servicio`)},
 cambiarRad(el){const s=servById(el.dataset.s),i=$('#nradn-'+s.id),r=resolverNombre(i.value,s.unidad),num=$('#nradnum-'+s.id).value,rad=armarRad(r.nom,num),igual=r.nom===partesRad(s.rad).nom;if(!r.nom)return toast('Elegí el nombre de la designación');if(!r.ok&&!igual&&!i.dataset.exc)return toast('Ese nombre no está en la lista: elegilo o usalo como excepción');if(!rad)return toast('Falta el número de la designación');if(rad===s.rad)return toast('Ya opera con esa designación');
  const u=radEnUso(rad,s.id);if(u)return toast(`${rad} ya la usa ${movTxt(MM[u.movil])}`);
  s.radHist.push({rad:radOf(s),hasta:iso()});log('Cambio de designación',`${movTxt(MM[s.movil])}: ${radOf(s)} → ${rad}`,s.movil);s.rad=rad;if(!r.ok&&!igual)regExc(r.nom,rad,s.unidad,s.movil);toast('Ahora opera como '+rad)},
 desigAgregar(el){if(rol().id!=='gral')return toast('Solo el Administrador General');const x=S.excDesig.find(z=>z.id===el.dataset.id);if(!zonaNombre(x.nom))agregarNombre(x.nom,x.zona,x.unidad);S.excDesig.filter(z=>z.nom===x.nom&&z.estado==='pendiente').forEach(z=>z.estado='agregada');toast(x.nom+' ya aparece en la lista')},
 desigDescartar(el){if(rol().id!=='gral')return toast('Solo el Administrador General');S.excDesig.filter(z=>z.nom===el.dataset.v&&z.estado==='pendiente').forEach(z=>z.estado='descartada');log('Excepción descartada',el.dataset.v);toast('Excepción descartada')},
 desigNueva(){if(rol().id!=='gral')return toast('Solo el Administrador General');const nom=soloLetras($('#dn-nom').value),zona=$('#dn-zona').value;if(nom.length<3)return toast('Escribí el nombre, sin número');const y=zonaNombre(DESIG_ALIAS[nom]||nom);if(y)return toast(`Ese nombre ya está en la zona ${y}`);agregarNombre(nom,zona);toast(nom+' agregado a la zona '+zona)},
 desigQuitar(el){if(rol().id!=='gral')return toast('Solo el Administrador General');S.desigExtra=S.desigExtra.filter(e=>e.nom!==el.dataset.v);log('Designación quitada de la lista',el.dataset.v);toast('Se quitó de la lista. Los servicios en curso no cambian')},
 addDot(el){const s=servById(el.dataset.s),rl=$('#rol-'+s.id).value,p=resAsig($('#add-'+s.id).value);
  if(!p||typeof p==='number')return toast('No se identificó a la persona');const e=elegible(p,ctxServ(s));if(!e.ok)return toast(e.msg);

 bajar(el){const s=servById(el.dataset.s),d=s.dot.find(z=>z.dni===Number(el.dataset.dni)&&!z.hasta),p=PM[d.dni];d.hasta=iso();log('Dotación',`${p.jer} ${p.nom} baja de ${movTxt(MM[s.movil])}`,s.movil)},
 marcarRet(el){const s=servById(el.dataset.s),mo=$('#ret-'+s.id).value,obs=$('#reto-'+s.id).value.trim();s.ret={motivo:mo,obs,desde:iso()};log('Ocupado',`${movTxt(MM[s.movil])} · ${MO[mo].nombre}${obs?' · '+obs:''}`,s.movil);toast('Móvil ocupado: no se libera hasta que lo indiques')},
 quitarRet(el){const s=servById(el.dataset.s);log('Se desocupó',`${movTxt(MM[s.movil])} · ${MO[s.ret.motivo].nombre}`,s.movil);s.ret=null},
 ajustar(el){const s=servById(el.dataset.s),v=$('#fin-'+s.id).value;if(!v)return;const n=new Date(v);if(n<=new Date(s.inicio))return toast('El fin tiene que ser posterior al inicio');
  log('Horario ajustado',`${movTxt(MM[s.movil])} · fin previsto ${fmt(s.finPrev)} → ${fmt(n.toISOString())}`,s.movil);s.finPrev=n.toISOString()},
 cerrar(el){const s=servById(el.dataset.s);cerrarServ(s,s.ret?'liberado tras '+MO[s.ret.motivo].nombre:'');if($('#dlg').open)$('#dlg').close();toast('Servicio cerrado: el móvil queda disponible')}
};
function pasar(el){const s=servById(el.dataset.s),t=servById(el.value),dni=Number(el.dataset.dni);if(!t)return;const d=s.dot.find(z=>z.dni===dni&&!z.hasta),now=iso(),p=PM[dni];
 if(enRol(t,d.rol)>=ROLMAX[d.rol])return toast(`El móvil ${movTxt(MM[t.movil])} ya tiene ${d.rol==='Acompañante'?'2 acompañantes':d.rol.toLowerCase()}. Bajá a alguien de ese móvil primero.`);
 d.hasta=now;t.dot.push({dni,rol:d.rol,desde:now,hasta:null});log('Cambio de móvil',`${p.jer} ${p.nom} pasa de ${movTxt(MM[s.movil])} a ${movTxt(MM[t.movil])}`,s.movil);toast('Integrante pasado al otro móvil')}

// acciones permitidas también al usuario de solo consulta (Monitoreo puede reportar lo que escucha en frecuencia)
const LIBRES=new Set(['reset','vaciar','tab','ficha','pers','cerrarDlg','fEst','fProg','reportar','rfCerrar']);

 fn(el);render()});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset||{};

 if(t.closest&&t.closest('#frm')){if(t.id==='fp-dni')t.value=t.value.replace(/\D/g,'');if(t.id==='fm-mat')t.value=t.value.replace(/\D/g,'');ui.chkForm&&ui.chkForm();return}

function buscar(q){const t=q.trim();if(!t)return;const m=resMov(t);if(m){if(!movPropio(m))return toast('Ese móvil es de otra dirección');return openFicha(m.id)}const p=resPers(t);

 if(ir.length===1)return openFicha(ir[0].id);
 if(ir.length){ui.tab='moviles';ui.fEst='';ui.fDiv='';ui.fTxt=t;render();return}
 if(p&&typeof p==='object'){if(!persPropio(p))return toast('Esa persona es de otra dirección');return openPers(p.dni)}
 if(p){ui.tab='personal';ui.pDir='';ui.pApto='';ui.pTxt=t;render();return}
 toast('No se encontró ningún móvil ni efectivo')}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.combo)pintarCombo(e.target)});
document.addEventListener('focusout',e=>{if(e.target.dataset&&e.target.dataset.combo)cerrarCombo(e.target)});
document.addEventListener('mousedown',e=>{const t=e.target;
 if(t.dataset&&t.dataset.combo&&$('#lst-'+t.id).hidden)return pintarCombo(t);
 const o=t.closest&&t.closest('.combo-lst');if(!o)return;e.preventDefault();const b=t.closest('.combo-op');if(b)elegirCombo(o.parentNode.querySelector('input'),b.dataset.v,b.dataset.exc)});
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.combo)return;const l=$('#lst-'+t.id);if(l.hidden)return;
 const ops=[...l.querySelectorAll('.combo-op')],i=ops.findIndex(o=>o.classList.contains('act'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!ops.length)return;if(i>=0)ops[i].classList.remove('act');const n=e.key==='ArrowDown'?(i+1)%ops.length:(i<=0?ops.length:i)-1;ops[n].classList.add('act');ops[n].scrollIntoView({block:'nearest'})}
 else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cerrarCombo(t)}
 else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();const o=i>=0?ops[i]:resolverNombre(t.value,t.dataset.u).ok?null:ops.length===1&&!ops[0].dataset.exc?ops[0]:null;
  if(o)elegirCombo(t,o.dataset.v,o.dataset.exc);else if(resolverNombre(t.value,t.dataset.u).ok){const r=resolverNombre(t.value,t.dataset.u);elegirCombo(t,r.nom)}}},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;
 if(t.id==='rf'){A.reportar();render()}
 if(t.id==='gb'){buscar(t.value);t.value=''}
 if(t.dataset&&t.dataset.dr){e.preventDefault();const i=DRORD.indexOf(t.dataset.dr);if(i<DRORD.length-1)$('#f-'+DRORD[i+1]).focus();else{A.cargar();render()}}});
